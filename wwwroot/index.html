<!DOCTYPE html>
<html lang="de-de">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ZIVA-Prototype</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link href="css/site.css" rel="stylesheet" />
    <link rel="stylesheet" href="ZIVA-Prototype.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <script>
        window.getViewportWidth = () => window.innerWidth;

        window.registerResizeHandler = (dotNetHelper) => {
            window.addEventListener('resize', () => {
                dotNetHelper.invokeMethodAsync('OnResize');
            });
        };
    </script>
    <script>
        window.scrollHelpers = {
            ignoreNextScroll: false,

            scrollTo: function (element, x, y) {
                if (!element) return;
                this.ignoreNextScroll = true;
                element.scrollTo({ left: x, top: y, behavior: 'auto' });
            }
        };
    </script>


</head>

<body>

    <div class="status-bar-safe-area"></div>

    <div id="app">Loading...</div>

    <script src="js/scroll-handler.js"></script>
    <script src="js/drag-drop-handler.js"></script>
    <script src="js/timeinterval-zoom-handler.js"></script>
    <script src="js/viewportwith-handler.js"></script>
    <script src="js/timeline.js"></script>
    <script src="js/svg-container-size-handler.js"></script>
    <script src="js/dragHelper.js"></script>
    <script src="js/ResizeHandler.js"></script>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webview.js" autostart="false"></script>

</body>

</html>
